[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gem-agentic-ai"
version = "0.1.0"
description = "An agentic AI framework demonstrating LangGraph state machines, bounded tool execution, multi-tool orchestration, and multi-turn conversation."
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "langchain>=1.3,<2",
    "langchain-core>=1.4,<2",
    "langchain-openai>=1.3,<2",
    "langgraph>=1.2,<2",
    "duckduckgo_search>=8.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/gem_agentic_ai"]
omit = ["src/gem_agentic_ai/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/gem_agentic_ai --cov-report=term-missing --cov-report=html"
markers = [
    "integration: tests that invoke external services (network, APIs)",
]
